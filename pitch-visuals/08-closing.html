<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kodo - Closing</title>
  <link rel="stylesheet" href="shared-styles.css">
  <style>
    .closing-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      min-height: 100vh;
      position: relative;
    }

    .logo-mark {
      width: 100px;
      height: 100px;
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 2.5rem;
      position: relative;
      animation: pulse-glow 4s ease-in-out infinite;
    }

    @keyframes pulse-glow {
      0%, 100% {
        box-shadow: 0 0 30px rgba(34, 197, 94, 0.15);
      }
      50% {
        box-shadow: 0 0 60px rgba(34, 197, 94, 0.3);
      }
    }

    .logo-mark svg {
      width: 56px;
      height: 56px;
      stroke: #22c55e;
      fill: none;
      stroke-width: 1.5;
    }

    .main-headline {
      font-size: 4.5rem;
      font-weight: 600;
      letter-spacing: -0.05em;
      line-height: 1.1;
      margin-bottom: 1.25rem;
      background: linear-gradient(180deg, #ffffff 0%, #888888 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: fadeInUp 1s ease-out;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .tagline {
      font-size: 1.5rem;
      color: #808080;
      margin-bottom: 3.5rem;
      max-width: 700px;
      animation: fadeInUp 1s ease-out 0.2s backwards;
      font-weight: 400;
    }

    .highlight-text {
      color: #22c55e;
    }

    .features-list {
      display: flex;
      gap: 3rem;
      margin-bottom: 4rem;
      animation: fadeInUp 1s ease-out 0.4s backwards;
    }

    .feature-point {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 1.125rem;
      color: #c0c0c0;
    }

    .feature-point svg {
      width: 24px;
      height: 24px;
      stroke: #22c55e;
      fill: none;
      stroke-width: 2;
      flex-shrink: 0;
    }

    .cta-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      animation: fadeInUp 1s ease-out 0.6s backwards;
    }

    .cta-button {
      padding: 1rem 3rem;
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.3);
      border-radius: 8px;
      color: #22c55e;
      font-size: 1.125rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      display: inline-block;
    }

    .cta-button:hover {
      background: rgba(34, 197, 94, 0.15);
      border-color: rgba(34, 197, 94, 0.5);
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(34, 197, 94, 0.2);
    }

    .contact-info {
      font-size: 1rem;
      color: #707070;
    }

    .divider {
      width: 60px;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(34, 197, 94, 0.5), transparent);
      margin: 3rem 0;
    }

    .powered-by {
      font-size: 0.875rem;
      color: #606060;
      margin-top: 3rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .tech-badge {
      padding: 0.5rem 1rem;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 6px;
      font-size: 0.75rem;
      color: #808080;
    }

    @media (max-width: 768px) {
      .main-headline {
        font-size: 3rem;
      }

      .tagline {
        font-size: 1.25rem;
      }

      .features-list {
        flex-direction: column;
        gap: 1.5rem;
        align-items: center;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="closing-section">
      <!-- Logo Mark -->
      <div class="logo-mark">
        <svg viewBox="0 0 24 24">
          <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
        </svg>
      </div>

      <!-- Main Headline -->
      <h1 class="main-headline">Kodo.</h1>

      <!-- Tagline -->
      <p class="tagline">
        The <span class="highlight-text">Action Engine</span> Behind Every Meeting.
      </p>

      <!-- Feature Points -->
      <div class="features-list">
        <div class="feature-point">
          <svg viewBox="0 0 24 24">
            <path d="M22 11.08V12a10 10 0 11-5.93-9.14"/>
            <path d="M22 4L12 14.01l-3-3"/>
          </svg>
          <span>Real-time extraction</span>
        </div>
        <div class="feature-point">
          <svg viewBox="0 0 24 24">
            <path d="M22 11.08V12a10 10 0 11-5.93-9.14"/>
            <path d="M22 4L12 14.01l-3-3"/>
          </svg>
          <span>One-click execution</span>
        </div>
        <div class="feature-point">
          <svg viewBox="0 0 24 24">
            <path d="M22 11.08V12a10 10 0 11-5.93-9.14"/>
            <path d="M22 4L12 14.01l-3-3"/>
          </svg>
          <span>Zero manual work</span>
        </div>
      </div>

      <div class="divider"></div>

      <!-- CTA -->
      <div class="cta-section">
        <a href="#" class="cta-button">Request Early Access</a>
        <div class="contact-info">
          hello@kodo.app
        </div>
      </div>

      <!-- Powered By -->
      <div class="powered-by">
        <span>Powered by</span>
        <div class="tech-badge">Claude AI</div>
        <div class="tech-badge">MCP</div>
        <div class="tech-badge">Real-time Transcription</div>
      </div>
    </div>
  </div>
</body>
</html>
