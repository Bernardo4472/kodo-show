<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kodo - Hero Visual</title>
  <link rel="stylesheet" href="shared-styles.css">
  <style>
    .hero-container {
      text-align: center;
      padding: 80px 0;
    }

    .hero-headline {
      font-size: 6rem;
      font-weight: 600;
      letter-spacing: -0.05em;
      line-height: 1;
      margin-bottom: 2rem;
      background: linear-gradient(180deg, #ffffff 0%, #888888 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .hero-subline {
      font-size: 1.5rem;
      line-height: 1.6;
      color: #909090;
      max-width: 900px;
      margin: 0 auto 4rem;
    }

    .ui-mockup {
      position: relative;
      margin: 0 auto;
      max-width: 1000px;
      perspective: 1200px;
    }

    .mockup-window {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 3rem;
      backdrop-filter: blur(20px);
      transform: rotateX(5deg);
      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.5),
        0 0 100px rgba(34, 197, 94, 0.1);
      animation: float 6s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% {
        transform: rotateX(5deg) translateY(0px);
      }
      50% {
        transform: rotateX(5deg) translateY(-10px);
      }
    }

    .mockup-header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
    }

    .mockup-content {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .task-line {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1rem;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 8px;
      opacity: 0;
      animation: slideIn 0.6s ease-out forwards;
    }

    .task-line:nth-child(1) { animation-delay: 0.2s; }
    .task-line:nth-child(2) { animation-delay: 0.4s; }
    .task-line:nth-child(3) { animation-delay: 0.6s; }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateX(-20px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .task-checkbox {
      width: 20px;
      height: 20px;
      border: 2px solid rgba(34, 197, 94, 0.5);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .task-checkbox.checked {
      background: rgba(34, 197, 94, 0.2);
      border-color: #22c55e;
    }

    .task-checkbox.checked::after {
      content: '✓';
      color: #22c55e;
      font-size: 0.75rem;
    }

    .task-text {
      font-size: 1rem;
      color: #c0c0c0;
      text-align: left;
    }
  </style>
  <script src="slide-navigation.js"></script>
</head>
<body>
  <div class="container">
    <div class="hero-container">
      <h1 class="hero-headline">Meetings → Tasks.<br>Automatically.</h1>
      <p class="hero-subline">
        Kodo turns real-time conversations into structured tasks, Jira tickets, PR prompts,
        design updates, and documentation.
      </p>

      <div class="ui-mockup">
        <div class="mockup-window">
          <div class="mockup-header">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
          </div>
          <div class="mockup-content">
            <div class="task-line">
              <div class="task-checkbox checked"></div>
              <div class="task-text">Update authentication flow with OAuth integration</div>
            </div>
            <div class="task-line">
              <div class="task-checkbox checked"></div>
              <div class="task-text">Design new dashboard mockups in Figma</div>
            </div>
            <div class="task-line">
              <div class="task-checkbox"></div>
              <div class="task-text">Document API endpoints for developer portal</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
