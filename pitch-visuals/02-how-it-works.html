<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kodo - How It Works</title>
  <link rel="stylesheet" href="shared-styles.css">
  <style>
    .how-it-works {
      text-align: center;
    }

    .title {
      font-size: 3rem;
      font-weight: 600;
      letter-spacing: -0.03em;
      margin-bottom: 4rem;
      color: #ffffff;
    }

    .steps-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3rem;
      max-width: 1200px;
      margin: 0 auto;
    }

    .step {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      opacity: 0;
      animation: fadeInUp 0.6s ease-out forwards;
    }

    .step:nth-child(1) { animation-delay: 0.1s; }
    .step:nth-child(2) { animation-delay: 0.3s; }
    .step:nth-child(3) { animation-delay: 0.5s; }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .step-icon {
      width: 120px;
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      transition: all 0.3s ease;
    }

    .step:hover .step-icon {
      border-color: rgba(34, 197, 94, 0.4);
      background: rgba(255, 255, 255, 0.05);
      transform: scale(1.05);
    }

    .step-icon svg {
      width: 56px;
      height: 56px;
      stroke: #ffffff;
      fill: none;
      stroke-width: 1.5;
    }

    .step-title {
      font-size: 1.25rem;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 0.5rem;
    }

    .step-description {
      font-size: 1rem;
      color: #808080;
      line-height: 1.5;
      max-width: 280px;
    }

    .arrow-separator {
      color: rgba(255, 255, 255, 0.2);
      font-size: 2rem;
      flex-shrink: 0;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 0.2;
      }
      50% {
        opacity: 0.5;
      }
    }

    .integration-icons {
      display: flex;
      gap: 0.75rem;
      margin-top: 1rem;
      justify-content: center;
    }

    .integration-icon {
      width: 32px;
      height: 32px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .integration-icon svg {
      width: 18px;
      height: 18px;
      stroke: #909090;
    }

    @media (max-width: 768px) {
      .steps-container {
        flex-direction: column;
        gap: 2rem;
      }

      .arrow-separator {
        transform: rotate(90deg);
      }
    }
  </style>
  <script src="slide-navigation.js"></script>
</head>
<body>
  <div class="container">
    <div class="how-it-works">
      <h2 class="title">How It Works</h2>

      <div class="steps-container">
        <!-- Step 1: Meeting Conversation -->
        <div class="step">
          <div class="step-icon">
            <svg viewBox="0 0 24 24">
              <path d="M12 15c1.66 0 3-1.34 3-3V6c0-1.66-1.34-3-3-3S9 4.34 9 6v6c0 1.66 1.34 3 3 3z"/>
              <path d="M19 10v2c0 3.87-3.13 7-7 7s-7-3.13-7-7v-2"/>
              <path d="M12 19v4"/>
              <path d="M8 23h8"/>
            </svg>
          </div>
          <div>
            <div class="step-title">Meeting Conversation</div>
            <div class="step-description">
              Real-time audio capture from calls, standups, and planning sessions
            </div>
          </div>
        </div>

        <div class="arrow-separator">→</div>

        <!-- Step 2: AI Extraction -->
        <div class="step">
          <div class="step-icon">
            <svg viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="3"/>
              <path d="M12 1v6m0 6v6M1 12h6m6 0h6"/>
              <circle cx="12" cy="12" r="10"/>
              <path d="M16.24 7.76l-2.12 2.12m0 4.24l2.12 2.12M7.76 16.24l2.12-2.12m4.24 0l2.12 2.12"/>
            </svg>
          </div>
          <div>
            <div class="step-title">AI Extraction</div>
            <div class="step-description">
              Intelligent parsing into actionable tasks, assignments, and context
            </div>
          </div>
        </div>

        <div class="arrow-separator">→</div>

        <!-- Step 3: One-Click Execution -->
        <div class="step">
          <div class="step-icon">
            <svg viewBox="0 0 24 24">
              <path d="M9 11l3 3L22 4"/>
              <path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/>
            </svg>
          </div>
          <div>
            <div class="step-title">One-Click Execution</div>
            <div class="step-description">
              Auto-create tickets, PRs, designs, and docs in your tools
            </div>
            <div class="integration-icons">
              <!-- Jira -->
              <div class="integration-icon">
                <svg viewBox="0 0 24 24">
                  <rect x="3" y="3" width="7" height="7" rx="1"/>
                  <rect x="14" y="3" width="7" height="7" rx="1"/>
                  <rect x="14" y="14" width="7" height="7" rx="1"/>
                  <rect x="3" y="14" width="7" height="7" rx="1"/>
                </svg>
              </div>
              <!-- GitHub -->
              <div class="integration-icon">
                <svg viewBox="0 0 24 24">
                  <path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 00-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0020 4.77 5.07 5.07 0 0019.91 1S18.73.65 16 2.48a13.38 13.38 0 00-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 005 4.77a5.44 5.44 0 00-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 009 18.13V22"/>
                </svg>
              </div>
              <!-- Figma -->
              <div class="integration-icon">
                <svg viewBox="0 0 24 24">
                  <circle cx="12" cy="12" r="3"/>
                  <rect x="7" y="3" width="5" height="5" rx="2.5"/>
                  <rect x="12" y="3" width="5" height="5" rx="2.5"/>
                  <rect x="7" y="16" width="5" height="5" rx="2.5"/>
                </svg>
              </div>
              <!-- Slack -->
              <div class="integration-icon">
                <svg viewBox="0 0 24 24">
                  <path d="M14.5 10c-.83 0-1.5-.67-1.5-1.5v-5c0-.83.67-1.5 1.5-1.5s1.5.67 1.5 1.5v5c0 .83-.67 1.5-1.5 1.5z"/>
                  <path d="M20.5 10H19V8.5c0-.83.67-1.5 1.5-1.5s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/>
                  <path d="M9.5 14c.83 0 1.5.67 1.5 1.5v5c0 .83-.67 1.5-1.5 1.5S8 21.33 8 20.5v-5c0-.83.67-1.5 1.5-1.5z"/>
                  <path d="M3.5 14H5v1.5c0 .83-.67 1.5-1.5 1.5S2 16.33 2 15.5 2.67 14 3.5 14z"/>
                  <path d="M14 14.5c0-.83.67-1.5 1.5-1.5h5c.83 0 1.5.67 1.5 1.5S21.33 16 20.5 16h-5c-.83 0-1.5-.67-1.5-1.5z"/>
                  <path d="M15.5 19H14v1.5c0 .83.67 1.5 1.5 1.5s1.5-.67 1.5-1.5-.67-1.5-1.5-1.5z"/>
                  <path d="M10 9.5C10 8.67 9.33 8 8.5 8h-5C2.67 8 2 8.67 2 9.5S2.67 11 3.5 11h5c.83 0 1.5-.67 1.5-1.5z"/>
                  <path d="M8.5 5H10V3.5C10 2.67 9.33 2 8.5 2S7 2.67 7 3.5 7.67 5 8.5 5z"/>
                </svg>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
