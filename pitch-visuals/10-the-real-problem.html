<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kodo - The Real Problem</title>
  <link rel="stylesheet" href="shared-styles.css">
  <style>
    .real-problem-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      min-height: 100vh;
    }

    .title {
      font-size: 2.75rem;
      font-weight: 600;
      letter-spacing: -0.03em;
      margin-bottom: 3rem;
      color: #ffffff;
      animation: fadeInUp 0.8s ease-out;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .main-message {
      font-size: 1.75rem;
      line-height: 1.6;
      color: #b0b0b0;
      max-width: 800px;
      margin: 0 auto 2rem;
      animation: fadeInUp 0.8s ease-out 0.2s backwards;
    }

    .highlight {
      color: #22c55e;
      font-weight: 500;
    }

    .subline {
      font-size: 1.25rem;
      color: #707070;
      margin-top: 2.5rem;
      animation: fadeInUp 0.8s ease-out 0.4s backwards;
    }

    .divider {
      width: 80px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(34, 197, 94, 0.4), transparent);
      margin: 2.5rem auto;
      animation: fadeIn 1s ease-out 0.6s backwards;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    @media (max-width: 768px) {
      .title {
        font-size: 2rem;
      }

      .main-message {
        font-size: 1.375rem;
      }

      .subline {
        font-size: 1.125rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="real-problem-section">
      <h2 class="title">The Real Problem</h2>

      <div class="divider"></div>

      <p class="main-message">
        Meetings hold all the context — <span class="highlight">decisions, requests, changes</span>.<br>
        But almost none of it becomes structured work.
      </p>

      <p class="subline">
        Kodo captures it at the source.
      </p>
    </div>
  </div>
</body>
</html>
